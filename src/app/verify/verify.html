<main class="container py-5" style="max-width: 420px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Check your email</h1>
      <p class="text-body-secondary small mb-4">We sent a 6-digit code to your ATU email. It runs out after 15 minutes.</p>

      @if (infoMsg()) {
        <div class="alert alert-success py-2 small">{{ infoMsg() }}</div>
      }

      <form (submit)="verify($event, email.value, code.value)">
        <label class="form-label" for="email">ATU email</label>
        <input #email id="email" class="form-control mb-3" type="email" [value]="startEmail" required>

        <label class="form-label" for="code">6-digit code</label>
        <input #code id="code" class="form-control mb-3 text-center fs-4" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" required>

        @if (errorMsg()) {
          <div class="alert alert-danger py-2 small" role="alert">{{ errorMsg() }}</div>
        }

        <button class="btn btn-primary w-100" type="submit" [disabled]="loading()">
          {{ loading() ? 'Checking...' : 'Verify email' }}
        </button>
      </form>

      <div class="d-flex justify-content-between small mt-3">
        <button class="btn btn-link btn-sm p-0" type="button" (click)="resend(email.value)">Resend code</button>
        <a routerLink="/login">Back to log in</a>
      </div>
    </div>
  </div>
</main>
