<div class="container mt-4" style="max-width: 360px;">
  <h2>Login</h2>

  <input #username class="form-control mb-2" placeholder="Username">
  <input #password class="form-control mb-2" type="password" placeholder="Password">
  <button class="btn btn-primary w-100" (click)="login(username.value, password.value)">Login</button>

  @if (errorMsg) {
    <p class="text-danger mt-2">{{ errorMsg }}</p>
  }
</div>
