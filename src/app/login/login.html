<main class="container py-5" style="max-width: 420px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Log in</h1>
      <p class="text-body-secondary small mb-4">Use your ATU email to rate and review your modules.</p>

      @if (infoMsg()) {
        <div class="alert alert-success py-2 small">{{ infoMsg() }}</div>
      }

      <form (submit)="login($event, email.value, password.value)">
        <label class="form-label" for="email">ATU email</label>
        <input #email id="email" class="form-control mb-3" type="email" placeholder="s00123456@atu.ie" autocomplete="email" required>

        <label class="form-label" for="password">Password</label>
        <input #password id="password" class="form-control mb-3" type="password" autocomplete="current-password" required>

        @if (errorMsg()) {
          <div class="alert alert-danger py-2 small" role="alert">{{ errorMsg() }}</div>
        }

        <button class="btn btn-primary w-100" type="submit" [disabled]="loading()">
          {{ loading() ? 'Logging in...' : 'Log in' }}
        </button>
      </form>

      <p class="text-center small mt-3 mb-0">New here? <a routerLink="/signup">Create an account</a></p>
    </div>
  </div>
</main>
