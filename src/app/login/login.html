<div class="container mt-4" style="max-width: 360px;">
  <h2>Login</h2>

  <input #email class="form-control mb-2" type="email" placeholder="ATU email">
  <input #password class="form-control mb-2" type="password" placeholder="Password"
         (keyup.enter)="login(email.value, password.value)">

  <button class="btn btn-primary w-100" [disabled]="loading()"
          (click)="login(email.value, password.value)">
    {{ loading() ? 'Logging in...' : 'Login' }}
  </button>

  @if (errorMsg()) {
    <p class="text-danger mt-2">{{ errorMsg() }}</p>
  }
</div>
